# ============================================================
# Config for run_solve.py — Mini-Problem Solver
# ============================================================
# Usage:
#   python run_solve.py                                        # defaults
#   python run_solve.py model=deepseek                         # different model
#   python run_solve.py data.input_path=my_problems.csv        # custom input
# ============================================================

seed: 42

defaults:
  - model: qwen2.5-7b

prompt_config_path: prompts/solve.json

# --- Solver settings ---
solve_mode: all  # "all" | "ordinary_only" | "creative_only"

# --- Data paths ---
data:
  input_path: generated_problems.csv
  examples_path: data/examples.json

# --- Sampling parameters ---
sampling_params:
  temperature: 0.7
  top_p: 0.95
  max_tokens: 512
  n: 1

# --- Validation ---
validation:
  problem_min_words: 4
  problem_max_words: 9
  solution_min_words: 1
  solution_max_words: 3

# --- Output ---
output:
  filename: solved_problems.csv

# --- W&B ---
wandb:
  project: mini-problems
  run_name: solve-${model.name}
  job_type: solving
