# Gemma-2-9B-it — Google's instruction-tuned model
# VRAM: ~18GB | Fits: 1x 4090
# Good at: diverse perspective (different training data than Meta/Qwen)
# Note: Gemma doesn't support "system" role — code handles this automatically
# License: Gemma license (requires HF agreement)
name: gemma2-9b
model_path: google/gemma-2-9b-it
vllm_args:
  tensor_parallel_size: 1
  max_model_len: 4096
  gpu_memory_utilization: 0.90
  trust_remote_code: true
