# ============================================================
# Config for run_generate.py — Mini-Problem Generator
# ============================================================
# Usage:
#   python run_generate.py                          # defaults
#   python run_generate.py model=qwen2.5-14b        # bigger model
#   python run_generate.py n_problems=50            # generate 50 problems
#   python run_generate.py diversity.similarity_threshold=0.65  # stricter dedup
# ============================================================

seed: 42

# --- Model (defaults, overridden by configs/model/*.yaml) ---
defaults:
  - model: qwen2.5-7b

# --- Prompt configuration ---
prompt_config_path: prompts/generate.json

# --- Generation settings ---
n_problems: 20
batch_size: 5
n_examples: 5
use_rejected: true

# --- Data paths ---
data:
  examples_path: data/examples.json
  rejected_path: data/rejected.json

# --- Sampling parameters (passed to vLLM SamplingParams) ---
sampling_params:
  temperature: 0.8
  top_p: 0.95
  max_tokens: 2048
  n: 1

# --- Diversity control (anti-redundancy) ---
diversity:
  # Semantic similarity threshold: problems above this cosine similarity are rejected
  # Lower = stricter (more diverse), higher = more lenient
  # Recommended: 0.75 for first 100, then lower to 0.65 for 100-300
  similarity_threshold: 0.75
  # Sentence-transformers model for embeddings (~80MB, auto-downloaded)
  embed_model: all-MiniLM-L6-v2
  # How many recent problems to show in the exclusion prompt
  max_exclusion_items: 15

# --- Validation (Chain of Verification) ---
validation:
  problem_min_words: 4
  problem_max_words: 9
  solution_min_words: 1
  solution_max_words: 3
  max_retries: 2

# --- Output ---
output:
  filename: generated_problems.csv

# --- Weights & Biases (optional) ---
wandb:
  project: mini-problems
  run_name: generate-${model.name}
  job_type: generation
